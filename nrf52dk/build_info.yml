     - 'd:/nrf-connect-ws/hr/sta/sysbuild.conf'
  sysbuild: 'true'
version: '0.1.0'
west:
  command: 'C:\nrf\toolchains\b8b84efebd\opt\bin\Scripts\west build --build-dir d:/nrf-connect-ws/hr/sta/nrf52dk d:/nrf-connect-ws/hr/sta --pristine --board nrf52840dk/nrf52840 --sysbuild -- -DDTC_OVERLAY_FILE=boards/nrf52840dk_nrf52840.overlay'
