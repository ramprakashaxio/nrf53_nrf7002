     - 'C:/nrf/v3.1.0/zephyr/boards/nordic/nrf52840dk'
    qualifiers: 'nrf52840'
    revision: ''
  images:
   - name: 'sta'
     source-dir: 'D:/nrf-connect-ws/hr/sta'
     type: 'MAIN'
